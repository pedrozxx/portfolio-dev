    <!-- Fontes auto-hospedadas (subconjunto latin, licenca OFL), em vez do CSS
         do Google Fonts: aquele <link> era a maior fatia do caminho critico —
         334 ms dos 401 ms ate o DOMContentLoaded, medido em 25/08/2026. Dois
         arquivos, mesma origem, pre-carregados. `crossorigin` e obrigatorio
         mesmo em same-origin: sem ele o Chrome baixa cada fonte duas vezes. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/sora-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Roda antes da primeira pintura. Sem isto a página nasce com o tema do
         sistema e troca para o escolhido só depois de o bundle carregar — o
         flash branco clássico. Precisa ser inline e síncrono. -->
    <script>(function(){try{var t=localStorage.getItem('tema');if(t==='claro'||t==='escuro')document.documentElement.setAttribute('data-tema',t)}catch(e){}})()</script>

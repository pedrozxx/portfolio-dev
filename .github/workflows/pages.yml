name: Publicar no GitHub Pages

# O portfólio é estático: React compilado para HTML, CSS e JS. Não há servidor,
# não há chamada de API em tempo de visita. Por isso o Pages basta.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que está em andamento: interromper no
# meio deixaria o site publicado em estado indefinido.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build
        # O Pages serve em /portfolio-dev/, não na raiz. Sem BASE_PATH o HTML
        # pediria /assets/... e receberia 404 — página em branco.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Impedir o Jekyll de processar a saída
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Contraste
        # O site afirma no rodape que segue contraste medido. Esta etapa recalcula
        # cada par e reprova o build se algum cair abaixo do piso da WCAG — a
        # afirmacao so vale enquanto alguem a verifica.
        run: npm run contraste

      - name: Build
        run: npm run build
